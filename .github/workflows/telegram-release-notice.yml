name: Telegram release notice

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Post short notice to the Telegram announcement group
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_NOTICE_CHAT_ID }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sums_url="https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS"
          sha=$(curl -fsSL "$sums_url" | awk '/\.apk$/ {print $1; exit}' || true)
          msg="【飞连 VPN Android ${TAG}】新版本已发布"$'\n'
          msg+="下载与核验：${RELEASE_URL}"$'\n'
          if [ -n "$sha" ]; then msg+="APK SHA-256：${sha}"$'\n'; fi
          msg+="详细更新说明见发布页。"$'\n'
          msg+="使用问题请到官方群：https://t.me/flylinevpn"
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${msg}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
